<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MeteoHrouz - محطة الرصد الفلاحي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1315">
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    :root {
      --green: #00e676;
      --green-dark: #00c853;
      --card-bg: rgba(18, 26, 28, 0.86);
      --box-bg: rgba(255, 255, 255, 0.05);
      --text-white: #ffffff;
      --text-gray: #9ca3af;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      margin: 0;
      padding: 0 0 85px 0;
      min-height: 100vh;
      color: var(--text-white);
      background-color: #0b1315;
      background-image: 
        linear-gradient(180deg, rgba(11, 25, 28, 0.72) 0%, rgba(11, 19, 21, 0.92) 45%, rgba(11, 19, 21, 0.98) 100%),
        url('https://unsplash.com');
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .tab-content { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* الشريط العلوي */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .region-selector {
      background: rgba(15, 32, 30, 0.75);
      border: 1.5px solid var(--green);
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      max-width: 175px;
    }
    .region-selector option { background: #121a1c; color: #fff; }

    /* قسم المحطة والحرارة الرئيسية */
    .hero-section {
      text-align: center;
      padding: 6px 0 22px 0;
    }
    .station-tag {
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .station-title {
      font-size: 26px;
      font-weight: 800;
      margin: 0;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    .station-sub {
      color: #cbd5e1;
      font-size: 13.5px;
      margin-top: 4px;
    }
    .main-temp {
      font-size: 76px;
      font-weight: 800;
      line-height: 1.05;
      margin: 14px 0 6px 0;
      direction: ltr;
      text-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .sky-status {
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
    }
    .min-max-row {
      margin-top: 8px;
      font-size: 15px;
      color: #e2e8f0;
      font-weight: 600;
      direction: ltr;
    }
    .min-max-row span { color: var(--green); font-weight: 800; }

    /* البطاقات الداكنة */
    .dark-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    /* بطاقة حالة الحقل والمناخ (الخط الأخضر الجانبي) */
    .field-card {
      border-right: 4px solid var(--green);
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-title-green {
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-badge {
      color: var(--text-gray);
      font-size: 12.5px;
      font-weight: 600;
      direction: ltr;
    }

    .agri-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
      text-align: center;
    }
    .agri-item-label {
      color: var(--text-gray);
      font-size: 12.5px;
      margin-bottom: 4px;
    }
    .agri-item-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
      direction: ltr;
    }
    .agri-item-val small {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .sun-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 13.5px;
      color: #e2e8f0;
      font-weight: 600;
    }

    /* زر مشاركة النشرة الفلاحية على واتساب */
    .whatsapp-share-btn {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      background: rgba(0, 230, 118, 0.14);
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* توقعات 7 أيام */
    .section-heading {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 14px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .forecast-row {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
    }
    .forecast-row::-webkit-scrollbar { display: none; }
    .f-box {
      min-width: 96px;
      background: var(--box-bg);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      flex-shrink: 0;
    }
    .f-box.today-box {
      border-color: rgba(0, 230, 118, 0.45);
      background: rgba(0, 230, 118, 0.08);
    }
    .f-day { font-size: 13.5px; font-weight: 700; color: #e2e8f0; }
    .f-icon { font-size: 28px; margin: 8px 0; }
    .f-temps { font-size: 14px; font-weight: 800; direction: ltr; }
    .f-rain { font-size: 12.5px; color: #38bdf8; font-weight: 700; margin-top: 4px; }

    /* مواقيت الصلاة */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .p-box {
      background: var(--box-bg);
      border-radius: 14px;
      padding: 12px 6px;
      text-align: center;
    }
    .p-box span { font-size: 13px; color: var(--text-gray); display: block; }
    .p-box b { font-size: 16px; font-weight: 800; color: #fff; margin-top: 4px; display: block; direction: ltr; }

    /* تبويبات الرادار والإرشاد والإعدادات */
    .radar-frame {
      width: 100%;
      height: 72vh;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    iframe { width: 100%; height: 100%; border: none; }

    .lens-btn {
      background: var(--green-dark);
      color: #0b1315;
      border: none;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .search-box { display: flex; gap: 8px; margin-top: 10px; }
    .search-box input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-family: 'Cairo', sans-serif;
    }
    .search-box button {
      padding: 0 18px;
      background: var(--green);
      color: #0b1315;
      border: none;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      cursor: pointer;
    }
    .advice-box {
      background: rgba(0, 230, 118, 0.1);
      border-right: 3px solid var(--green);
      padding: 12px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.8;
      margin-top: 10px;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #11191c;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 10px 0;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #9ca3af;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-item i { font-size: 20px; margin-bottom: 4px; }
    .nav-item.active { color: var(--green); }
  </style>
</head>
<body>

  <!-- 1. الرئيسية -->
  <div id="home" class="tab-content active">
    <div class="top-bar">
      <select class="region-selector" id="regionSelect" onchange="changeStation(this.value)">
        <option value="hrouz">الرضاع الشرقية، تونس</option>
        <option value="regueb">معتمدية الرقاب</option>
        <option value="sidibouzid">سيدي بوزيد المدينة</option>
        <option value="gps">📍 موقعي الحالي (GPS)</option>
      </select>
      <div class="brand-name">MeteoHrouz</div>
    </div>

    <div class="hero-section">
      <div class="station-tag">محطة الرصد الفلاحي</div>
      <h1 class="station-title" id="station-name">الرضاع الشرقية (محطة حروز)</h1>
      <div class="station-sub" id="station-sub">ولاية سيدي بوزيد - معتمدية الرقاب</div>
      <div class="main-temp" id="temp">--°C</div>
      <div class="sky-status" id="desc">جاري الرصد...</div>
      <div class="min-max-row" id="minmax">--°C <span>↑</span> / --°C <span>↓</span></div>
    </div>

    <!-- بطاقة حالة الحقل والمناخ -->
    <div class="dark-card field-card">
      <div class="card-header-row">
